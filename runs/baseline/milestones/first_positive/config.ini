# NEAT hyperparameters for BipedalWalker-v3. Read fresh on every start AND resume.
# Hidden-layer guarantee: num_hidden > 0 with full_nodirect means every
# input->output path starts through a hidden node. train.py also refuses
# linear (0 hidden in use) genomes for the hall of fame and penalises them.

[NEAT]
fitness_criterion     = max
fitness_threshold     = 1000
no_fitness_termination = True
pop_size              = 200
reset_on_extinction   = True

[DefaultGenome]
num_inputs            = 24
num_outputs           = 4
num_hidden            = 8
initial_connection    = full_nodirect
feed_forward          = True

activation_default    = tanh
activation_mutate_rate = 0.0
activation_options    = tanh
aggregation_default   = sum
aggregation_mutate_rate = 0.0
aggregation_options   = sum

bias_init_mean        = 0.0
bias_init_stdev       = 0.5
bias_init_type        = gaussian
bias_max_value        = 5.0
bias_min_value        = -5.0
bias_mutate_power     = 0.3
bias_mutate_rate      = 0.7
bias_replace_rate     = 0.05

response_init_mean    = 1.0
response_init_stdev   = 0.0
response_init_type    = gaussian
response_max_value    = 5.0
response_min_value    = -5.0
response_mutate_power = 0.0
response_mutate_rate  = 0.0
response_replace_rate = 0.0

weight_init_mean      = 0.0
weight_init_stdev     = 0.5
weight_init_type      = gaussian
weight_max_value      = 5.0
weight_min_value      = -5.0
weight_mutate_power   = 0.5
weight_mutate_rate    = 0.8
weight_replace_rate   = 0.05

compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

conn_add_prob         = 0.3
conn_delete_prob      = 0.1
node_add_prob         = 0.1
node_delete_prob      = 0.05

enabled_default       = True
enabled_mutate_rate   = 0.01
enabled_rate_to_false_add = 0.0
enabled_rate_to_true_add  = 0.0

single_structural_mutation = False
structural_mutation_surer  = default

[DefaultSpeciesSet]
compatibility_threshold = 0.6
# train.py --target-species adapts this each generation (0 disables)

[DefaultStagnation]
species_fitness_func  = max
max_stagnation        = 20
species_elitism       = 2

[DefaultReproduction]
elitism               = 2
survival_threshold    = 0.2
min_species_size      = 2
